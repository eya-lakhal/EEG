# Thème de base (clair : ivoire froid, bleu pétrole, turquoise EEG) ; le détail typographique et les composants
# sont dans ui/theme.py. Les couleurs ci-dessous sont les mêmes que ui/theme.py (une seule palette).
[theme]
base = "light"
primaryColor = "#2A8C8C"
backgroundColor = "#F5F7F5"
secondaryBackgroundColor = "#EBF0EE"
textColor = "#1C2B33"
font = "sans serif"

[client]
toolbarMode = "minimal"

[browser]
gatherUsageStats = false

[server]
# sert le dossier static/ (image de fond static/bg_brain.png, générée par tools/make_background.py)
enableStaticServing = true
