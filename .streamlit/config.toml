# Thème de base (clair : fond rose bébé, texte noir et bleu marine, usage clinique) ; le détail typographique et les composants
# sont dans ui/theme.py. Les couleurs ci-dessous sont les mêmes que ui/theme.py (une seule palette).
[theme]
base = "light"
primaryColor = "#1D4E96"
backgroundColor = "#FBE4EA"
secondaryBackgroundColor = "#F6D2DD"
textColor = "#14171C"
font = "sans serif"

[client]
toolbarMode = "minimal"

[browser]
gatherUsageStats = false

[server]
# sert le dossier static/ (image de fond static/bg_brain.png, générée par tools/make_background.py)
enableStaticServing = true
